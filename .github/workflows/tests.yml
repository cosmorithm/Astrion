name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline tests
        run: bash astrion-agent/run_tests.sh

  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r astrion-agent/requirements-research-test.txt
      - name: Run research and API regression
        env:
          ASTRION_TEST_PYTHON: python
        run: bash astrion-agent/run_research_tests.sh
      - name: Build trusted execution image
        run: docker build -t astrion-research:1 astrion-agent/research/execution
      - name: Run actual isolated execution checks
        working-directory: astrion-agent
        env:
          ASTRION_TEST_DOCKER: '1'
        run: python -B -m unittest tests.research.test_docker_live -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        working-directory: astrion-agent/frontend
        run: |
          npm ci
          npm run build
